{{- /* Secret keys are the env var names Otari reads; the Deployment loads them with envFrom. */ -}}
{{- $manual := list "OTARI_MASTER_KEY" "OTARI_SECRET_KEY" }}
{{- if .Values.overlay.enabled }}
  {{- $manual = append $manual "LAGO_API_KEY" }}
{{- end }}
{{- if .Values.smtp.credentialsFromSecret }}
  {{- $manual = concat $manual (list "OTARI_SMTP_USER" "OTARI_SMTP_PASSWORD") }}
{{- end }}
{{- range $name, $p := .Values.hostedProviders }}
  {{- if and $p (not (has $p.apiKeyEnv $manual)) }}
    {{- $manual = append $manual $p.apiKeyEnv }}
  {{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace | default "platform" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OTARI_DATABASE_URL: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/{{ .Values.secrets.dbName }}?sslmode=require'
        OTARI_RATE_LIMIT_REDIS_URL: '{{ "{{ .REDIS_URL }}" }}'
        {{- if .Values.overlay.enabled }}
        # The overlay's wallet holds, under keys prefixed publicai:.
        PUBLICAI_REDIS_URL: '{{ "{{ .REDIS_URL }}" }}'
        {{- end }}
        {{- range $manual }}
        {{ . }}: '{{ printf "{{ .%s }}" . }}'
        {{- end }}
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.dbPasswordArn }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: DB_HOST
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: {{ .Values.secrets.redisUrlProperty | default "LITELLM_REDIS_URL" }}
    {{- range $manual }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.secrets.manualSecretsName }}
        property: {{ . }}
    {{- end }}
